<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responses — InsightLoop</title>
  <meta name="description" content="View and analyze your InsightLoop feedback responses.">

  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responses.css">
</head>

<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <div id="navbar-container"></div>

    <div class="page-content">

      <!-- ═══════════════════════════════════════════════════════════
           HEADER: FORM SELECTOR + STATS
           ═══════════════════════════════════════════════════════════ -->
      <div class="responses-header">
        <div class="form-selector-wrap">
          <select id="formSelector" class="form-input form-selector" aria-label="Select form">
            <option value="">Select a form...</option>
          </select>
        </div>

        <div class="responses-stats-bar" id="statsBar" style="display:none;">
          <div class="stat-chip">
            <span class="stat-label">Total</span>
            <span class="stat-value" id="statTotal">0</span>
          </div>
          <div class="stat-chip">
            <span class="stat-label">Positive</span>
            <span class="stat-value text-success" id="statPositive">0%</span>
          </div>
          <div class="stat-chip">
            <span class="stat-label">Complaints</span>
            <span class="stat-value text-danger" id="statComplaint">0</span>
          </div>
          <div class="stat-chip">
            <span class="stat-label">Pending AI</span>
            <span class="stat-value text-warning" id="statPending">0</span>
          </div>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════════════════════
           FILTER BAR
           ═══════════════════════════════════════════════════════════ -->
      <div class="filter-bar-card" id="filterBar" style="display:none;">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="sentiment" data-value="all">All</button>
          <button class="filter-btn" data-filter="sentiment" data-value="positive">Positive</button>
          <button class="filter-btn" data-filter="sentiment" data-value="neutral">Neutral</button>
          <button class="filter-btn" data-filter="sentiment" data-value="negative">Negative</button>
        </div>

        <div class="filter-group">
          <button class="filter-btn active" data-filter="urgency" data-value="all">All Urgency</button>
          <button class="filter-btn" data-filter="urgency" data-value="high">High</button>
          <button class="filter-btn" data-filter="urgency" data-value="medium">Medium</button>
          <button class="filter-btn" data-filter="urgency" data-value="low">Low</button>
        </div>

        <label class="toggle-label">
          <input type="checkbox" id="complaintsOnly"> Complaints only
        </label>

        <div class="date-range-group">
          <input type="date" id="dateFrom" class="form-input date-input" aria-label="Start date">
          <span class="date-sep">to</span>
          <input type="date" id="dateTo" class="form-input date-input" aria-label="End date">
        </div>

        <div class="search-group">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="searchInput" class="form-input search-input" placeholder="Search in summaries...">
        </div>

        <div class="sort-group" style="margin-left: auto; display: flex; align-items: center; gap: 0.5rem;">
          <i data-lucide="arrow-up-down" class="text-muted" style="width: 18px; height: 18px;"></i>
          <select id="sortSelect" class="form-input form-selector" style="min-width: 140px;">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════════════════════
           RESPONSES LIST
           ═══════════════════════════════════════════════════════════ -->
      <div class="responses-list-container" id="responsesList">
        <!-- Default State -->
        <div class="empty-state" id="defaultState">
          <i data-lucide="inbox"></i>
          <p>Please select a form to view responses.</p>
        </div>
      </div>

    </div><!-- /.page-content -->
  </main>


  <!-- ═══════════════════════════════════════════════════════════════════════
       MODAL — RESPONSE DETAILS
       ═══════════════════════════════════════════════════════════════════════ -->
  <div class="modal fade" id="responseModal" tabindex="-1" aria-labelledby="responseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">

        <div class="modal-header response-modal-header">
          <div class="modal-badges">
            <span class="badge-sentiment negative" id="modalSentiment">Negative</span>
            <span class="badge-urgency high" id="modalUrgency">High</span>
            <span class="badge-complaint" id="modalComplaint" style="display:none"><i data-lucide="alert-triangle"></i> Complaint</span>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body response-modal-body">
          <p class="modal-date" id="modalDate">May 10, 2026 at 2:30 PM</p>

          <div class="modal-section">
            <span class="section-label">AI Summary</span>
            <p id="modalSummary" class="modal-summary-text">
              Customer experienced cold food and long wait times...
            </p>
          </div>

          <div class="modal-row">
            <div class="modal-section flex-1">
              <span class="section-label">Topic</span>
              <p id="modalTopic" class="modal-topic-text">Food Quality</p>
            </div>

            <div class="modal-section flex-2" id="keyPhrasesSection">
              <span class="section-label">Key Phrases</span>
              <div id="modalKeyPhrases" class="key-phrases-row">
                <!-- chips -->
              </div>
            </div>
          </div>

          <hr class="responses-divider">

          <div class="modal-section">
            <span class="section-label">Customer Answers</span>
            <div id="modalAnswers" class="modal-answers-container">
              <!-- Dynamically rendered -->
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Close</button>
        </div>

      </div>
    </div>
  </div>


  <!-- Scripts ────────────────────────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module" src="../js/responses.js"></script>

</body>

</html>
