<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — InsightLoop</title>
  <meta name="description" content="Manage your InsightLoop business account.">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/settings.css">
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div id="navbar-container"></div>

    <div class="page-content">
      <div class="settings-header">
        <h1><i data-lucide="settings"></i> Account Settings</h1>
        <p>Manage your business profile and security preferences.</p>
      </div>

      <div class="settings-grid">
        <!-- Profile Column -->
        <div class="settings-card">
          <h2 class="card-title">Business Profile</h2>
          <form id="profileForm" class="settings-form">
            <div class="form-group">
              <label class="form-label" for="busName">Business Name</label>
              <input type="text" id="busName" class="form-input" required>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="busEmail">Email Address (Read Only)</label>
              <input type="email" id="busEmail" class="form-input" readonly disabled>
              <div class="form-help">Contact support to change your login email.</div>
            </div>

            <div class="form-group">
              <label class="form-label" for="busIndustry">Industry</label>
              <select id="busIndustry" class="form-input form-selector" required>
                <option value="">Select industry</option>
                <option value="Restaurant">Restaurant</option>
                <option value="Retail">Retail</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Software">Software / Tech</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="busPhone">Phone Number</label>
              <input type="tel" id="busPhone" class="form-input" placeholder="e.g. 1234567890">
            </div>

            <button type="submit" class="btn-brand w-100" id="btnSaveProfile">
              Save Changes
            </button>
            <div id="profileMsg" class="form-msg"></div>
          </form>
        </div>

        <!-- Security Column -->
        <div class="settings-card">
          <h2 class="card-title">Security</h2>
          <form id="passwordForm" class="settings-form">
            <div class="form-group">
              <label class="form-label" for="currPass">Current Password</label>
              <input type="password" id="currPass" class="form-input" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="newPass">New Password</label>
              <input type="password" id="newPass" class="form-input" required minlength="8">
              <div class="form-help">Must be at least 8 characters long.</div>
            </div>

            <div class="form-group">
              <label class="form-label" for="confPass">Confirm New Password</label>
              <input type="password" id="confPass" class="form-input" required minlength="8">
            </div>

            <button type="submit" class="btn-brand w-100" id="btnChangePass">
              Change Password
            </button>
            <div id="passMsg" class="form-msg"></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module" src="../js/settings.js"></script>
</body>
</html>
