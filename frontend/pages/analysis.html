<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis — InsightLoop</title>
  <meta name="description" content="AI-powered feedback analytics and trends.">

  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/analysis.css">
</head>
<body>

  <div id="sidebar-container"></div>

  <main class="main-content">
    <div id="navbar-container"></div>

    <div class="page-content">

      <!-- HEADER -->
      <div class="analysis-header">
        <div class="header-left">
          <h1><i data-lucide="bar-chart-2"></i> AI Analytics</h1>
          <p>Deep insights into your customer feedback.</p>
        </div>
        
        <div class="header-controls">
          <select id="formSelector" class="form-input form-selector" aria-label="Select form">
            <option value="">Select a form...</option>
          </select>

          <div class="time-tabs" id="timeTabs" style="display:none;">
            <button class="time-tab active" data-days="7">7d</button>
            <button class="time-tab" data-days="30">30d</button>
            <button class="time-tab" data-days="90">90d</button>
          </div>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div id="analysisContent" style="display:none;">
        
        <!-- STATS ROW -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Total Responses</div>
            <div class="stat-value" id="statTotal">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Avg. Rating (CSAT)</div>
            <div class="stat-value text-primary" id="statCSAT">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Positive Sentiment</div>
            <div class="stat-value text-success" id="statPositive">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Complaint Rate</div>
            <div class="stat-value text-danger" id="statComplaints">-</div>
          </div>
        </div>

        <!-- CHARTS ROW 1 -->
        <div class="charts-row">
          <div class="chart-card flex-1">
            <h3 class="chart-title">Sentiment Distribution</h3>
            <div class="chart-container skeleton-container">
              <div class="skeleton chart-skeleton"></div>
              <canvas id="sentimentDonut"></canvas>
            </div>
          </div>
          <div class="chart-card flex-1">
            <h3 class="chart-title">Urgency Levels</h3>
            <div class="chart-container skeleton-container">
              <div class="skeleton chart-skeleton"></div>
              <canvas id="urgencyBar"></canvas>
            </div>
          </div>
        </div>

        <!-- CHARTS ROW 2 -->
        <div class="charts-row">
          <div class="chart-card flex-2">
            <h3 class="chart-title">Sentiment Trend</h3>
            <div class="chart-container trend-container skeleton-container">
              <div class="skeleton chart-skeleton"></div>
              <canvas id="sentimentTrend"></canvas>
            </div>
          </div>
        </div>

        <!-- CHARTS ROW 3 -->
        <div class="charts-row">
          <div class="chart-card flex-1">
            <h3 class="chart-title">Top Topics</h3>
            <div class="chart-container skeleton-container">
              <div class="skeleton chart-skeleton"></div>
              <canvas id="topicsBar"></canvas>
            </div>
          </div>
          <div class="chart-card flex-1">
            <h3 class="chart-title">Rating Distribution</h3>
            <div class="chart-container skeleton-container">
              <div class="skeleton chart-skeleton"></div>
              <canvas id="ratingBar"></canvas>
            </div>
          </div>
        </div>

      </div>

      <!-- EMPTY STATE -->
      <div id="emptyState" class="empty-state">
        <i data-lucide="bar-chart-2"></i>
        <p>Please select a form to view analytics.</p>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="../js/analysis.js"></script>
</body>
</html>
