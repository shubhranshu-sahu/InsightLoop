<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — InsightLoop</title>
  <meta name="description"
    content="Log in to your InsightLoop dashboard to view customer feedback insights and analytics.">

  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

  <div class="auth-page">
    <!-- Background orbs -->
    <div class="auth-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>

    <div class="auth-card">
      <div class="auth-card-inner">

        <!-- Logo -->
        <a href="../index.html" class="auth-logo">
          <img src="../assets/images/logo.png" alt="InsightLoop">
          <span>Insight<span class="text-gradient">Loop</span></span>
        </a>

        <!-- Header -->
        <div class="auth-header">
          <h1>Welcome back</h1>
          <p>Log in to your dashboard to see what your customers are saying.</p>
        </div>

        <!-- Alert message (shown on error or success) -->
        <div id="auth-alert" class="auth-alert"></div>

        <!-- Login Form -->
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email" class="form-label">Email address</label>
            <input type="email" id="login-email" class="form-input" placeholder="owner@business.com"
              autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <div class="password-wrapper">
              <input type="password" id="login-password" class="form-input" placeholder="Enter your password"
                autocomplete="current-password" required>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-brand" id="login-btn">
            Log In
          </button>

          <!-- DEV MODE: Bypass Auth for UI Testing -->
          <button type="button" class="btn-ghost" style="width: 100%; margin-top: 1rem;" onclick="
            localStorage.setItem('insightloop_token', 'dev-token');
            localStorage.setItem('insightloop_user', JSON.stringify({ name: 'Dev User', email: 'dev@test.com' }));
            window.location.href = 'dashboard.html';
          ">
            Bypass Login (UI Dev Mode)
          </button>
        </form>

        <!-- Footer link -->
        <div class="auth-footer">
          Don't have an account? <a href="register.html">Create one</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/auth.js"></script>
</body>

</html>
